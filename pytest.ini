[pytest]
testpaths = tests
pythonpath = . backend/services/catalog backend/services/gateway backend/services/identity backend/services/orchestrator backend/services/semantic_router backend/services/sql_executor backend/services/sql_generator backend/services/visualization packages/contracts packages/observability
markers =
    unit: unit tests
    integration: tests that require running Docker containers or databases
    resilience: fault tolerance and chaos tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
