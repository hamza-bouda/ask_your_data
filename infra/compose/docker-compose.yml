# Ask Your Data — Docker Compose (Phase 01)
# All services start as skeletons with /health and /ready endpoints.
# Build context is the repo root so that packages/contracts is accessible.

services:
  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askyourdata
      POSTGRES_PASSWORD: askyourdata_dev
      POSTGRES_DB: askyourdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askyourdata"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ayd

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ayd

  # ── Application Services ───────────────────────────────────────
  gateway:
    build:
      context: ../../
      dockerfile: backend/services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      CORS_ALLOW_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ayd

  identity:
    build:
      context: ../../
      dockerfile: backend/services/identity/Dockerfile
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      LOCAL_AUTH_ENABLED: "true"
      DEV_ENDPOINTS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ayd

  catalog:
    build:
      context: ../../
      dockerfile: backend/services/catalog/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ../../.env
    environment:
      APP_ENV: development
      # Keep the embedding model between container recreations. Without this
      # cache, the catalog remains unavailable while it downloads the model on
      # every local restart.
      HF_HOME: /root/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /root/.cache/sentence_transformers
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ayd

  query-execution:
    build:
      context: ../../
      dockerfile: backend/services/query_execution/Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ayd

  orchestrator:
    build:
      context: ../../
      dockerfile: backend/services/orchestrator/Dockerfile
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ayd

  visualization:
    build:
      context: ../../
      dockerfile: backend/services/visualization/Dockerfile
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ayd

  worker:
    build:
      context: ../../
      dockerfile: backend/services/orchestrator/Dockerfile
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ayd

  semantic-router:
    build:
      context: ../../
      dockerfile: backend/services/semantic_router/Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - ../../.env
    networks:
      - ayd

  sql-generator:
    build:
      context: ../../
      dockerfile: backend/services/sql_generator/Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - ../../.env
    networks:
      - ayd

  sql-executor:
    build:
      context: ../../
      dockerfile: backend/services/sql_executor/Dockerfile
    ports:
      - "8007:8007"
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ayd

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - ayd

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    networks:
      - ayd

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ayd

  jaeger:
    image: jaegertracing/all-in-one:1.59
    # Jaeger 1.59 binds OTLP receivers to localhost by default. Application
    # containers use the Docker network, so bind explicitly to all interfaces.
    command:
      - --collector.otlp.grpc.host-port=0.0.0.0:4317
      - --collector.otlp.http.host-port=0.0.0.0:4318
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - ayd

volumes:
  pgdata:
  hf_cache:

networks:
  ayd:
    driver: bridge
