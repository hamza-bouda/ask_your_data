[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-your-data-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for Ask Your Data microservices"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*"]
