name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile services and shared packages
        run: |
          python -m compileall -q backend/services packages/contracts packages/observability

  deterministic-service-tests:
    name: ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Visualization
            requirements: backend/services/visualization/requirements.txt
            tests: backend/services/visualization/tests
            pythonpath: ${{ github.workspace }}
          - name: SQL executor
            requirements: backend/services/sql_executor/requirements.txt
            tests: backend/services/sql_executor/tests
            pythonpath: ${{ github.workspace }}/backend/services/sql_executor:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }} pytest httpx
          python -m pip install -e packages/contracts -e packages/observability
      - name: Run deterministic service tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: python -m pytest -q ${{ matrix.tests }}

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local composition
        run: |
          printf 'FERNET_KEY=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=\n' > .env
          docker compose -f infra/compose/docker-compose.yml config -q
