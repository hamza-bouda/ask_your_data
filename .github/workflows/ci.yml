name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Security Scan
        run: npm audit --audit-level=high || true
      - name: Unit Tests
        run: npm test
      - name: Build
        run: npm run build

  python-security:
    name: Python security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r backend/services/visualization/requirements.txt -r backend/services/sql_executor/requirements.txt -r backend/services/semantic_router/requirements.txt -r backend/services/sql_generator/requirements.txt -r backend/services/orchestrator/requirements.txt -r backend/services/catalog/requirements.txt -r backend/services/identity/requirements.txt -r backend/services/gateway/requirements.txt

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile services and shared packages
        run: |
          python -m compileall -q backend/services packages/contracts packages/observability

  deterministic-service-tests:
    name: ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Identity
            requirements: backend/services/identity/requirements.txt
            tests: tests/identity
            pythonpath: ${{ github.workspace }}/backend/services/identity:${{ github.workspace }}
          - name: Catalog and Integration
            requirements: backend/services/catalog/requirements.txt
            tests: tests/catalog tests/integration
            pythonpath: ${{ github.workspace }}/backend/services/catalog:${{ github.workspace }}
          - name: Visualization
            requirements: backend/services/visualization/requirements.txt
            tests: backend/services/visualization/tests
            pythonpath: ${{ github.workspace }}
          - name: SQL executor and Adapters
            requirements: backend/services/sql_executor/requirements.txt
            tests: tests/sql_executor tests/adapters tests/security
            pythonpath: ${{ github.workspace }}/backend/services/sql_executor:${{ github.workspace }}
          - name: Semantic router
            requirements: backend/services/semantic_router/requirements.txt
            tests: tests/semantic_router
            pythonpath: ${{ github.workspace }}/backend/services/semantic_router:${{ github.workspace }}
          - name: SQL generator
            requirements: backend/services/sql_generator/requirements.txt
            tests: tests/sql_generator
            pythonpath: ${{ github.workspace }}/backend/services/sql_generator:${{ github.workspace }}
          - name: Gateway
            requirements: backend/services/gateway/requirements.txt
            tests: tests/gateway
            pythonpath: ${{ github.workspace }}/backend/services/gateway:${{ github.workspace }}
          - name: Orchestrator
            requirements: backend/services/orchestrator/requirements.txt
            tests: tests/orchestrator tests/e2e/test_chinook_regression.py
            pythonpath: ${{ github.workspace }}/backend/services/orchestrator:${{ github.workspace }}
            testing: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }} pytest pytest-cov httpx
          python -m pip install -e packages/contracts -e packages/observability
      - name: Run deterministic service tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
          TESTING: ${{ matrix.testing }}
          JWT_SECRET: dev-secret-change-in-production
          JWT_SECRET_KEY: dev-secret-change-in-production
          FERNET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: python -m pytest --cov=backend/services --cov-report=xml -q ${{ matrix.tests }}

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local composition
        run: |
          printf 'FERNET_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=\nJWT_SECRET=dev-secret-change-in-production\n' > .env
          docker compose -f infra/compose/docker-compose.yml config -q

  e2e:
    name: Deterministic end-to-end workflow
    runs-on: ubuntu-latest
    needs: [frontend, python-syntax, deterministic-service-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare local-only runtime configuration
        run: |
          printf 'FERNET_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=\nJWT_SECRET=dev-secret-change-in-production\n' > .env
      - name: Start deterministic E2E stack
        run: docker compose -f tests/e2e/docker-compose.e2e.yml up -d --build --wait
      - name: Run black-box E2E tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx
          python -m pytest -q tests/e2e/test_end_to_end.py
      - name: Setup Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Playwright UI Tests
        working-directory: e2e-browser
        run: |
          npm ci
          npx playwright install --with-deps
          npm run test
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-browser/playwright-report/
      - name: Print service logs on failure
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.e2e.yml logs --no-color
      - name: Stop E2E stack
        if: always()
        run: docker compose -f tests/e2e/docker-compose.e2e.yml down -v --remove-orphans
