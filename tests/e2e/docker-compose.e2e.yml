name: askyourdata-e2e

include:
  - ../../infra/compose/docker-compose.yml

services:
  catalog:
    build:
      context: ../..
      dockerfile: backend/services/catalog/Dockerfile.e2e
    environment:
      CATALOG_EMBEDDINGS_ENABLED: "false"
      FERNET_KEY: ${FERNET_KEY}
  semantic-router:
    environment:
      # The E2E scenario uses catalogue discovery and needs no provider key.
      LLM_PROVIDER: mock
  sql-generator:
    environment:
      LLM_PROVIDER: mock
